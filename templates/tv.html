{% extends 'base.html' %}
{% block content %}
<h1>Đăng nhập TV</h1>
<p class="subtle">Trang riêng cho khách hàng được cho phép đăng nhập TV.</p>

<section class="card">
  <h2>Thông tin đăng nhập</h2>
  <form id="tvLoginPageForm" class="form-grid">
    <p class="subtle">Hệ thống sẽ tự chọn email được cấp quyền trong admin, bạn chỉ cần nhập mật khẩu và mã TV.</p>
    <label>Mật khẩu
      <input name="tv_password" type="password" placeholder="Nhập mật khẩu" required>
    </label>
    <label>Mã TV (8 số)
      <input name="tv_code" inputmode="numeric" maxlength="8" pattern="\d{8}" placeholder="Nhập mã TV 8 số" required>
    </label>
    <div class="actions">
      <button type="submit" class="btn-primary" id="tvLoginPageBtn">Đăng nhập TV</button>
    </div>
  </form>
  <div id="tvStatusBox" class="result-box"></div>
</section>

{% endblock %}
